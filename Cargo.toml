[workspace]
resolver = "2"
members = [
    "hwr-ink",
    "hwr-model",
    "hwr-app",
]
# Reference checkouts (their own git repos), not part of this workspace —
# exclude them so cargo doesn't try to fold them in.
exclude = [
    "paddle-ocr-rs",
    "oar-ocr",
    "Crane",
    "xybrid",
]

[workspace.package]
edition = "2021"

[profile.dev.package."*"]
opt-level = 2
