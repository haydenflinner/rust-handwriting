[package]
name = "hwr-model"
version = "0.1.0"
edition.workspace = true

[dependencies]
# HAT (transformer + conv) is composed Burn ops. burn-wgpu `fusion`
# coalesces those into fewer GPU launches — we measured stock composed
# paths ~hundreds of times faster with it on. The custom CubeCL LSTM
# kernel needed fusion *off* (raw `CubeTensor`, not `FusionTensor`); that
# kernel is no longer on the recognizer path, so fusion is back on.
#
# Autodiff is native-only (training). Resolver 2 keeps that feature off
# for wasm so the browser build doesn't pull Burn's training graph.
burn = { version = "0.21.0", default-features = false, features = ["std", "wgpu", "fusion"] }
burn-cubecl = { version = "0.21.0", features = ["fusion"] }
cubecl = { version = "0.10.0", features = ["wgpu"] }
cgmath = "0.18"
hwr-ink = { path = "../hwr-ink" }
partial_sort = "1.0.0"
rand = { version = "0.10.2", default-features = false, features = ["std", "std_rng"] }
strsim = "0.11.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
burn = { version = "0.21.0", default-features = false, features = ["std", "wgpu", "autodiff", "fusion"] }
# Hyperparameter search (see bin/tune.rs): a real TPE sampler instead of
# hand-launched "variant A/B/C" parallel guesses. Pure-Rust; vendored under
# third_party/ (see that Cargo.toml for why not the crates.io release or
# the root-level `rustuna/` reference checkout directly) — only
# `rustuna_core` (Study/Trial/InMemoryStorage) + `rustuna_sampler` (TPE) are
# needed; `rustuna_storage`'s SQLite persistence isn't, since a single
# process's threads can share one in-memory `Study` (see tune.rs) — no
# cross-process coordination needed for that.
rustuna_core = { path = "../third_party/rustuna_core" }
rustuna_sampler = { path = "../third_party/rustuna_sampler" }

[dev-dependencies]
# CPU backend for fast finite-difference gradient checks in tests (see
# fused_lstm.rs) — not needed by any production code path.
#
# `default-features = false` here too (mirroring `[dependencies]`) is load
# -bearing, not cosmetic: Cargo unifies features across `[dependencies]` and
# `[dev-dependencies]` for the same crate when building tests. NdArray
# tests do not need wgpu/fusion; leaving defaults on would still pull
# burn-wgpu's default feature list into lib tests.
burn = { version = "0.21.0", default-features = false, features = ["std", "ndarray"] }
